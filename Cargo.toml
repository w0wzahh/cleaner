[package]
name = "cleaner"
version = "2.7.0"
edition = "2021"

[lib]
name = "cleaner"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
rfd = "0.14"
trash = "3.3"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
walkdir = "2"
sha2 = "0.10"
dirs = "5"
sysinfo = "0.30"
open = "4"