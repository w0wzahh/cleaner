[package]
name = "cleaner"
version = "2.9.2"
edition = "2021"

[lib]
name = "cleaner"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
rfd = "0.14"
trash = "3.3"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
walkdir = "2"
sha2 = "0.10"
dirs = "5"
sysinfo = "0.30"
open = "4"
tray-icon = "0.25.0"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3.0.11"
